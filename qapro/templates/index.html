<!doctype html>
<title>QAPRO Providers</title>
<h1>Providers</h1>
<a href="{{ url_for('register') }}">Register Provider</a>
<ul>
{% for p in providers %}
    <li><a href="{{ url_for('provider_detail', provider_id=p.id) }}">{{ p.name }}</a></li>
{% else %}
    <li>No providers yet.</li>
{% endfor %}
</ul>
